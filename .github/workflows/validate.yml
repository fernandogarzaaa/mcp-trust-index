name: Validate badges

# Runs on every PR (no paths filter): a required status check must be
# produced for every PR or auto-merge deadlocks. With no added badge
# files the validator trivially passes.

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=50
      - name: Validate added badge files
        run: node scripts/validate.mjs --base origin/${{ github.base_ref }}
