name: Rebuild index

on:
  push:
    branches: [main]
    paths:
      - "badges/**"
      - "revocations/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild manifest and site table
        run: node scripts/build-site.mjs
      - name: Commit rebuilt index
        run: |
          git config user.name "mcp-trust-index bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.json docs/index.html
          git diff --cached --quiet || git commit -m "Rebuild trust index [skip ci]"
          git push
