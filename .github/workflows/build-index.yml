name: Check index freshness

# The derived site files must be rebuilt by the PR author: the old
# push-to-main rebuild bot cannot run under branch protection.
# Runs on every PR; the build is deterministic, so a diff means stale files.

on:
  pull_request:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild manifest and site table
        run: node scripts/build-site.mjs
      - name: Fail if derived files are stale
        run: |
          if ! git diff --quiet -- docs/index.json docs/index.html; then
            echo "::error::docs/index.json / docs/index.html are stale. Run 'node scripts/build-site.mjs' and commit the result."
            git diff --stat -- docs/index.json docs/index.html
            exit 1
          fi
          echo "derived index files are fresh"
